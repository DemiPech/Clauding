name: APK Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les tests passent d'abord : si l'un echoue, l'APK n'est pas publie.
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/tests/package-lock.json

      - name: Installer
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests
        run: npm test

      # Le SDK CardNexus embarque doit correspondre au commit fige dans SDK_VERSION.
      - name: Verifier le SDK embarque
        working-directory: android/sdk
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../app/src/main/assets/www/js/vendor

  build:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk fab-decks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fab-decks-apk
          path: android/fab-decks.apk

      # Un lien fixe a ouvrir depuis le telephone. La branche main publie
      # apk-latest ; une autre branche, sa propre pre-release (apk-<branche>),
      # pour essayer une version sans remplacer celle de main.
      - name: Choisir la release
        id: release
        working-directory: .
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "tag=apk-latest" >> "$GITHUB_OUTPUT"
            echo "name=FaB Decks (dernier APK)" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._\n-' '-')
            echo "tag=apk-$slug" >> "$GITHUB_OUTPUT"
            echo "name=FaB Decks (branche $GITHUB_REF_NAME)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier en release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            APK compilé depuis `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Téléchargez `fab-decks.apk` depuis le téléphone puis ouvrez-le pour l'installer.
          files: android/fab-decks.apk
