name: APK Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk fab-decks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fab-decks-apk
          path: android/fab-decks.apk

      # Un lien fixe a ouvrir depuis le telephone :
      # https://github.com/<depot>/releases/tag/apk-latest
      - name: Publier en release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FaB Decks (dernier APK)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            APK compilé depuis `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Téléchargez `fab-decks.apk` depuis le téléphone puis ouvrez-le pour l'installer.
          files: android/fab-decks.apk
