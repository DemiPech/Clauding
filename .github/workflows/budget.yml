name: APK Budget

on:
  push:
    paths:
      - 'budget/**'
      - '.github/workflows/budget.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Les tests unitaires passent d'abord : si l'un echoue, l'APK n'est pas publie.
      - name: Tests unitaires
        run: gradle testDebugUnitTest --no-daemon

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk budget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: budget-apk
          path: budget/budget.apk

      # Un lien fixe a ouvrir depuis le telephone :
      # https://github.com/<depot>/releases/tag/budget-apk-latest
      - name: Publier en release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: budget-apk-latest
          name: Budget (dernier APK)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            APK compilé depuis `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Téléchargez `budget.apk` depuis le téléphone puis ouvrez-le pour l'installer.
          files: budget/budget.apk
